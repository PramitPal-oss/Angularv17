<div class="p-4  bg-white gap-3 shadow-md rounded-md " *ngIf="userList.length > 0">
  <p-table [value]="userList" styleClass="p-datatable-gridlines p-datatable-sm" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone Number</th>
        <th>Edit</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user let-i="rowIndex">
      <tr>
        <td>{{ user.fname }}</td>
        <td>{{ user.lname }}</td>
        <td>{{ user.fullname }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.phnumber }}</td>
        <td class="font-sans text-base cursor-pointer" (click)="onEditHandler(user,i)">
          ✏️
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
