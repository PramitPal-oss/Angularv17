<h3 class="font-mono text-center">Todo Using {{TYPE === 1 ? 'Event Emitter' : 'Subject'}}</h3>
<div class="flex justify-center items-center gap-2 mb-2">
  <div class="flex flex-col gap-2">
    <label for="todo" class="font-sans text-base font-semibold">Title</label>
    <input pInputText id="todo" aria-describedby="username-help" [(ngModel)]="value" />
    <small id="username-help" class="text-gray-400 font-sans font-light">
      Enter your username to reset your password
    </small>
  </div>
  <p-button label="Submit" [raised]="true" size="small" (click)="getTodoText()" />
</div>
